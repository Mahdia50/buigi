  <circle cx="0" cy="0" r="120" fill="none" stroke="#C2823D" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="0.0,-105.0 14.63,-73.56 40.18,-97.01 41.67,-62.36 74.25,-74.25 62.36,-41.67 97.01,-40.18 73.56,-14.63 105.0,0.0 73.56,14.63 97.01,40.18 62.36,41.67 74.25,74.25 41.67,62.36 40.18,97.01 14.63,73.56 0.0,105.0 -14.63,73.56 -40.18,97.01 -41.67,62.36 -74.25,74.25 -62.36,41.67 -97.01,40.18 -73.56,14.63 -105.0,0.0 -73.56,-14.63 -97.01,-40.18 -62.36,-41.67 -74.25,-74.25 -41.67,-62.36 -40.18,-97.01 -14.63,-73.56" fill="#165B33" fill-opacity="0.1" stroke="#BC5A36" stroke-width="1.5" stroke-opacity="0.6"/>

