<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="-180 -180 360 360">
  <defs>
    <radialGradient id="rosetteGlow" cx="0%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#C2823D" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#BC5A36" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#211A16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldTrim" x1="-100" y1="-100" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D49B45"/>
      <stop offset="50%" stop-color="#C2823D"/>
      <stop offset="100%" stop-color="#8E541C"/>
    </linearGradient>
  </defs>

  <!-- Outer ambient glow circle -->
  <circle cx="0" cy="0" r="175" fill="url(#rosetteGlow)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="0" cy="0" r="170" fill="none" stroke="url(#goldTrim)" stroke-width="2.5" stroke-dasharray="3, 3" opacity="0.6"/>
  <circle cx="0" cy="0" r="165" fill="none" stroke="#C2823D" stroke-width="1.2" opacity="0.7"/>

