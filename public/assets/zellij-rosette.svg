  <polygon points="0.0,-65.0 16.07,-38.8 45.96,-45.96 38.8,-16.07 65.0,0.0 38.8,16.07 45.96,45.96 16.07,38.8 0.0,65.0 -16.07,38.8 -45.96,45.96 -38.8,16.07 -65.0,0.0 -38.8,-16.07 -45.96,-45.96 -16.07,-38.8" fill="#C2823D" fill-opacity="0.25" stroke="#D49B45" stroke-width="1.8" stroke-opacity="0.8"/>
  <polygon points="0.0,-35.0 7.65,-18.48 24.75,-24.75 18.48,-7.65 35.0,0.0 18.48,7.65 24.75,24.75 7.65,18.48 0.0,35.0 -7.65,18.48 -24.75,24.75 -18.48,7.65 -35.0,0.0 -18.48,-7.65 -24.75,-24.75 -7.65,-18.48" fill="#BC5A36" fill-opacity="0.4" stroke="#211A16" stroke-width="1.2"/>

